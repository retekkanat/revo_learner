[project]
name = "fde-aws-week1-day4-demo"
version = "1.0.0"
description = "Week 1 Day 4 demonstration of the AWS FDE course: Support Assistant v1 for Kestrel Telecom on Amazon Bedrock, with a recap of Days 1-3."
requires-python = ">=3.12,<3.14"
dependencies = [
    # AWS SDK. The crt extra is required for profiles signed in with `aws login`.
    "boto3>=1.43.123,<2",
    "botocore[crt]>=1.43.123,<2",
    # Data contract and response schemas.
    "pydantic>=2.12,<3",
    # Running the notebook.
    "jupyterlab>=4.4,<5",
    "ipykernel>=6.29",
    # Regenerating the notebook (scripts/build_notebook.py) and running it headless.
    "nbformat>=5.10",
    "nbclient>=0.10",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
