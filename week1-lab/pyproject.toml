[project]
name = "fde-aws-week1-lab"
version = "1.0.0"
description = "Week 1 lab package of the AWS FDE course: Support Assistant v1 for Kestrel Telecom on Amazon Bedrock."
requires-python = ">=3.12,<3.14"
dependencies = [
    "boto3>=1.43.123,<2",
    "pydantic>=2.12,<3",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.4,<5",
    "pytest>=8.4,<10",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
